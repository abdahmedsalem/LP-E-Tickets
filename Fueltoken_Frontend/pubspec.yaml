name: fueltoken_app
description: FuelToken — application mobile (bons carburant ACPeC).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  bloc: ^9.2.0
  equatable: ^2.0.8
  get_it: ^9.2.1
  go_router: ^17.2.3
  dio: ^5.9.2
  intl: ^0.20.2
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.2.0
  image_picker: ^1.2.2
  shared_preferences: ^2.5.5
  uuid: ^4.5.3
  collection: ^1.19.1
  lottie: ^3.3.1
  local_auth: ^2.3.0
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0
  package_info_plus: ^8.3.1
  curved_navigation_bar: ^1.0.6
  file_picker: ^11.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/lottie/
    - designs/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/logo_fueltoken_launcher.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/images/logo_fueltoken_launcher.png
  remove_alpha_ios: true
